<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="header">
      <h1 class="app-title">Music Player</h1>

      <div class="theme-toggle-container">
        <span id="theme_color"> Dark </span>

        <button id="theme-toggle-btn">
          <div class="toggle-circle"></div>
        </button>
      </div>
    </header>

    <!-- ================= MAIN CONTAINER ================= -->

    <main class="main-container">
      <!-- ================= ALL SONGS SECTION ================= -->

      <section class="all-songs-section">
        <div class="filter-container">
          <label for="genre-filter"> Filter by Genre: </label>

          <select id="genre-filter">
            <option value="all">All</option>

            <option value="pop">Pop</option>

            <option value="hiphop">Hip Hop</option>

            <option value="rock">Rock</option>
          </select>
        </div>

        <div class="playlist-form">
          <input type="text" id="Song-input" placeholder="Enter Song name" />

          <button id="search-btn">Search</button>
        </div>
        
        <h2 class="section-heading">All Songs</h2>

        <div id="songs-list"></div>
      </section>

      <!-- ================= PLAYER CARD SECTION ================= -->

      <section class="player-section">
        <!-- SONG CARD -->

        <div class="song-card">
          <img
            src="https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/c6/9b/1d/c69b1ddb-f873-53b4-9fc9-87ca49af2062/21UMGIM48676.rgb.jpg/440x440bb.jpg"
            alt="song-image"
            class="song-image"
          />

          <div class="song-details">
            <h2 id="current-song-name">Enter Sandman</h2>

            <p id="current-song-artist">Metallica 1</p>
          </div>
        </div>

        <!-- AUDIO PLAYER -->

        <audio
          id="audio-player"
          src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/23/3a/76/233a7642-1e06-d03c-a998-e445068e5c52/mzaf_10269670333044316164.plus.aac.ep.m4a"
          controls
        ></audio>

        <!-- CONTROL BUTTONS -->

        <div class="controls-container">
          <button id="prev-btn">
            <i class="fa-solid fa-backward"></i>
          </button>

          <button id="play-btn">
            <i class="fa-solid fa-play"></i>
          </button>

          <button id="next-btn">
            <i class="fa-solid fa-forward"></i>
          </button>
        </div>

        <!-- ADD TO PLAYLIST -->

        <button id="add-to-playlist-btn">Add To Playlist</button>
      </section>

      <!-- ================= PLAYLIST SECTION ================= -->

      <section class="playlist-section">
        <!-- CREATE PLAYLIST -->

        <div class="playlist-form">
          <input
            type="text"
            id="playlist-input"
            placeholder="Enter playlist name"
          />

          <button id="create-playlist-btn">Create Playlist</button>
        </div>

        <!-- PLAYLIST HEADING -->

        <h2 class="section-heading">Current Playlist</h2>
        <div id="Playlist-songs-list"></div>

        <!-- PLAYLIST LIST -->

        <div class="playlist-item">All Playlists</div>
        <div id="playlist-list"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
