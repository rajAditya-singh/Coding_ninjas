<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hover Hamburger Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #111;
      --fg: #fff;
      --muted: #aaa;
      --card: #1b1b1b;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0c0c0c;
      color: var(--fg);
      min-height: 100vh;
      display: grid;
      place-items: start center;
    }

    /* Header container */
    .nav {
      width: 100%;
      background: var(--bg);
      padding: 12px 16px;
      box-sizing: border-box;
      position: sticky;
      top: 0;
    }

    /* Wrapper so :hover/:focus-within can control the menu */
    .menu-wrapper {
      position: relative;
      margin-left: auto;
      width: max-content;
    }

    /* Hamburger button */
    .hamburger {
      display: inline-grid;
      gap: 4px;
      width: 40px;
      height: 40px;
      padding: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 10px;
    }
    .hamburger:hover,
    .hamburger:focus-visible {
      outline: 2px solid #3a3a3a;
      background: #161616;
    }
    .hamburger span {
      display: block;
      height: 2px;
      background: var(--fg);
      border-radius: 1px;
    }

    /* The dropdown menu */
    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background: var(--card);
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 8px;
      min-width: 180px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      display: none;              /* hidden by default */
    }

    /* Show menu on hover OR keyboard focus within wrapper */
    .menu-wrapper:hover .menu,
    .menu-wrapper:focus-within .menu {
      display: block;
    }

    .menu a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--fg);
      font-size: 15px;
    }
    .menu a:hover,
    .menu a:focus-visible {
      background: #232323;
    }

    /* Optional subtle section to see page content */
    .content {
      max-width: 900px;
      padding: 24px 16px 80px;
      color: var(--muted);
    }

    /* Small screens: keep behavior the same (hover still works; focus-within helps tap) */
    @media (hover: none) {
      /* On touch devices, tapping the button focuses it which triggers :focus-within */
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="menu-wrapper">
      <!-- The button is focusable for keyboard/touch; aria-label for accessibility -->
      <button class="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <nav class="menu" aria-label="Main">
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
        <a href="#blog">Blog</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <h1>Page Content</h1>
    <p>Hover the hamburger in the top-right to open the menu. On touch devices, tap once to open (focus), tap outside to close.</p>
  </main>
</body>
</html>
