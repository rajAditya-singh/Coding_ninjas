<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@700&family=Sedan+SC&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/635d59483f.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <main>
      <section class="left">
        <div class="profile">
          <img
            src="./assets/WhatsApp Image 2025-08-21 at 11.30.34 AM (1).jpeg"
            alt="profile_pic"
          />
          <p>John Doe</p>
        </div>
        <div class="nav">
          <i class="fa-solid fa-bars"></i>
          <a href="#board">Dashboard</a>
        </div>
        <div class="nav">
          <i class="fa-solid fa-tags"></i>
          <a href="#data">Data</a>
        </div>
        <div class="nav">
          <i class="fa-solid fa-user"></i>
          <a href="#users">Users</a>
        </div>
        <div class="nav">
          <i class="fa-solid fa-calendar-days"></i>
          <a href="#schedule">Schedule</a>
        </div>
        <div class="nav">
          <i class="fa-solid fa-gear"></i>
          <a href="#contact">Contact</a>
        </div>
      </section>
      <section class="right">
        <header>
          <h1>DashBoard</h1>
          <input
            type="search"
            name="search"
            id="search"
            placeholder="Search.."
          />
        </header>

        <article id="board">
          <div>
            <h3>Activities</h3>
            <p>May-June 2023</p>
          </div>
          <div>
            <img
              src="./assets/WhatsApp Image 2025-08-21 at 11.30.34 AM.jpeg"
              alt="Graph"
            />
          </div>
        </article>

        <article id="data">
          <div><h2>DashBoard Data</h2></div>
          <div class="container">
            <div class="card" id="card1">
              <div>
                <i class="fa-solid fa-dollar-sign"></i>
                <p class="top">Total Revenue</p>
                <p class="bottom">$456,553,563</p>
              </div>
            </div>
            <div class="card" id="card2"></div>

            <div class="card" id="card3"></div>

            <div class="card" id="card4"></div>

          </div>
        </article>

        <article id="users"></article>

        <article id="schedule"></article>

        <article id="contact"></article>
      </section>
    </main>
  </body>
</html>
